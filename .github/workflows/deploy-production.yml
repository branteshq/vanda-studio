name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vanda-production
  cancel-in-progress: false

jobs:
  deploy:
    # macOS, deliberately: the pinned nitro beta assigns react to server
    # chunks nondeterministically on linux, yielding two react copies and a
    # broken SSR bundle (null hook dispatcher). macOS builds have been
    # consistently correct. Revisit when nitro stabilizes.
    runs-on: macos-latest
    environment:
      name: production
      url: https://app.vandastudio.app
    steps:
      - name: Check out production revision
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Validate production revision
        run: |
          pnpm lint
          pnpm typecheck
          CI=true pnpm test
          pnpm build

      - name: Deploy Convex production
        working-directory: apps/vanda
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes --typecheck try --message "production $GITHUB_SHA"

      # Build on the runner and ship the output prebuilt: Vercel's remote build
      # container produces a broken SSR bundle for this app (bare require of
      # react in the _ssr chunk with no node_modules in the function), while
      # the same commit builds correctly on the pinned Node/pnpm toolchain.
      - name: Create staged production deployment
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # On GitHub runners std-env detects GITHUB_ACTIONS before VERCEL, so
          # nitro falls back to the node preset; force the vercel preset.
          NITRO_PRESET: vercel
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          deployment_url=$(pnpm dlx vercel@latest deploy --prebuilt --yes --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      # The staged deployment must prove it serves before it may touch the
      # domain — a broken SSR bundle then fails HERE and production keeps
      # running the previous deployment. Exact 200 required: a 302 means
      # Vercel deployment protection intercepted the request and nothing was
      # actually tested (protection must stay disabled for this project).
      - name: Smoke test staged deployment
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ steps.vercel.outputs.deployment_url }}/" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "staged deployment never returned 200 — refusing to promote"
          exit 1

      - name: Promote staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@latest promote "${{ steps.vercel.outputs.deployment_url }}" --yes --token="$VERCEL_TOKEN"

      - name: Smoke test production
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 https://app.vandastudio.app/ >/dev/null

      - name: Deployment summary
        run: |
          {
            echo "### Production deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: https://app.vandastudio.app"
            echo "- Vercel deployment: ${{ steps.vercel.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
