name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vanda-production
  cancel-in-progress: false

jobs:
  # The same revision is validated and deployed to dev first; production only after it succeeded.
  staging:
    name: Deploy to staging
    uses: ./.github/workflows/deploy-staging.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  deploy:
    needs: staging
    # macOS, deliberately: the pinned nitro beta assigns react to server
    # chunks nondeterministically on linux, yielding two react copies and a
    # broken SSR bundle (null hook dispatcher). macOS builds have been
    # consistently correct. Revisit when nitro stabilizes.
    runs-on: macos-latest
    environment:
      name: production
      url: https://app.vandastudio.app
    steps:
      - name: Check out production revision
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Deploy Convex production
        working-directory: apps/vanda
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes --typecheck try --message "production $GITHUB_SHA"

      # Every pending migration in migrations.ts, once per deployment.
      - name: Run Convex migrations
        working-directory: apps/vanda
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
        run: pnpm exec convex run migrations:runAll '{}'

      # Built on the runner and shipped prebuilt: Vercel's remote build
      # container mis-bundles the SSR function.
      - name: Deploy Vercel production
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # On GitHub runners std-env detects GITHUB_ACTIONS before VERCEL, so
          # nitro falls back to the node preset; force the vercel preset.
          NITRO_PRESET: vercel
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --yes --prod --token="$VERCEL_TOKEN"
