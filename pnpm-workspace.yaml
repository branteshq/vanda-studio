packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

catalog:
  "@astrojs/check": ^0.9.4
  "@tailwindcss/vite": ^4.3.1
  "@types/node": ^24.10.13
  "@vitejs/plugin-react": ^6.0.0
  astro: ^5.16.4
  oxfmt: ^0.40.0
  oxlint: 1.80.0
  react: ^19.0.0
  react-dom: ^19.0.0
  turbo: ^2.3.3
  typescript: ^5.9.2
  vite: ^8.0.0

minimumReleaseAgeExclude:
  - "@base-ui/react@1.6.0"
  - "@base-ui/utils@0.3.1"
  - "@ai-sdk/openai@3.0.114"
  - "@shadcn/lint@0.2.0"
  - '@tanstack/react-start-rsc@0.1.63'
  - '@tanstack/react-start-server@1.167.50'
  - '@tanstack/react-start@1.169.2'
  - '@tanstack/router-generator@1.167.44'
  - '@tanstack/router-plugin@1.168.46'
  - '@tanstack/router-utils@1.162.4'
  - '@tanstack/start-plugin-core@1.171.53'
  - '@tanstack/start-server-core@1.169.43'

patchedDependencies:
